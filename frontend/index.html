<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Scheduler</title>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --border: #2a2d3a;
      --text: #e2e8f0;
      --muted: #64748b;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --green: #22c55e;
      --yellow: #eab308;
      --red: #ef4444;
      --blue: #3b82f6;
      --orange: #f97316;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 16px 32px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 18px; font-weight: 600; letter-spacing: -0.3px; }
    header span { font-size: 12px; color: var(--muted); }

    .sse-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--green);
      display: inline-block;
      margin-right: 6px;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; } 50% { opacity: 0.3; }
    }

    main { padding: 32px; max-width: 1400px; margin: 0 auto; }

    /* Dashboard cards */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 16px;
      margin-bottom: 32px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
    }

    .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 8px; }
    .card-value { font-size: 32px; font-weight: 700; }
    .card-value.pending  { color: var(--yellow); }
    .card-value.processing { color: var(--blue); }
    .card-value.completed { color: var(--green); }
    .card-value.failed   { color: var(--red); }
    .card-value.cancelled { color: var(--muted); }
    .card-value.dlq      { color: var(--orange); }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 24px; }
    .tab {
      padding: 8px 18px;
      border-radius: 6px;
      border: 1px solid transparent;
      cursor: pointer;
      font-size: 13px;
      background: transparent;
      color: var(--muted);
      transition: all 0.15s;
    }
    .tab:hover { color: var(--text); }
    .tab.active { background: var(--surface); border-color: var(--border); color: var(--text); }

    /* Form */
    .form-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 24px;
      max-width: 560px;
    }

    .form-card h2 { font-size: 15px; font-weight: 600; margin-bottom: 20px; }

    .field { margin-bottom: 16px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .field input, .field select, .field textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 9px 12px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s;
    }
    .field input:focus, .field select:focus, .field textarea:focus {
      border-color: var(--accent);
    }
    .field textarea { resize: vertical; min-height: 90px; font-family: monospace; }

    .btn {
      padding: 9px 20px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      transition: background 0.15s;
    }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-danger { background: var(--red); color: #fff; font-size: 12px; padding: 5px 12px; }
    .btn-danger:hover { background: #dc2626; }
    .btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-ghost:hover { border-color: var(--accent); }

    .success-msg { color: var(--green); font-size: 12px; margin-top: 10px; }
    .error-msg   { color: var(--red);   font-size: 12px; margin-top: 10px; }

    /* Table */
    .table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }

    table { width: 100%; border-collapse: collapse; }
    th {
      text-align: left;
      padding: 12px 16px;
      font-size: 11px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.6px;
      border-bottom: 1px solid var(--border);
    }
    td { padding: 12px 16px; border-bottom: 1px solid var(--border); font-size: 13px; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
    }
    .badge-PENDING    { background: rgba(234,179,8,0.15);  color: var(--yellow); }
    .badge-PROCESSING { background: rgba(59,130,246,0.15); color: var(--blue); }
    .badge-COMPLETED  { background: rgba(34,197,94,0.15);  color: var(--green); }
    .badge-FAILED     { background: rgba(239,68,68,0.15);  color: var(--red); }
    .badge-CANCELLED  { background: rgba(100,116,139,0.15);color: var(--muted); }

    .priority-1 { color: var(--red); font-weight: 600; }
    .priority-2 { color: var(--yellow); font-weight: 600; }
    .priority-3 { color: var(--muted); }

    .empty { text-align: center; padding: 48px; color: var(--muted); }

    .error-detail {
      font-size: 11px;
      color: var(--red);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body x-data="app()" x-init="init()">

  <header>
    <h1> Job Scheduler</h1>
    <div style="display:flex;align-items:center;gap:8px;">
      <span class="sse-dot"></span>
      <span>Live updates active</span>
    </div>
  </header>

  <main>
    <!-- Dashboard Cards -->
    <div class="cards">
      <div class="card">
        <div class="card-label">Pending</div>
        <div class="card-value pending" x-text="counts.pending ?? 0"></div>
      </div>
      <div class="card">
        <div class="card-label">Processing</div>
        <div class="card-value processing" x-text="counts.processing ?? 0"></div>
      </div>
      <div class="card">
        <div class="card-label">Completed</div>
        <div class="card-value completed" x-text="counts.completed ?? 0"></div>
      </div>
      <div class="card">
        <div class="card-label">Failed</div>
        <div class="card-value failed" x-text="counts.failed ?? 0"></div>
      </div>
      <div class="card">
        <div class="card-label">Cancelled</div>
        <div class="card-value cancelled" x-text="counts.cancelled ?? 0"></div>
      </div>
      <div class="card">
        <div class="card-label">DLQ</div>
        <div class="card-value dlq" x-text="counts.dlq ?? 0"></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab" :class="{ active: tab === 'jobs' }" @click="tab = 'jobs'; loadJobs()">Jobs</button>
      <button class="tab" :class="{ active: tab === 'create' }" @click="tab = 'create'">Create Job</button>
      <button class="tab" :class="{ active: tab === 'dlq' }" @click="tab = 'dlq'; loadDlq()">Dead Letter Queue</button>
    </div>

    <!-- Jobs Table -->
    <div x-show="tab === 'jobs'">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
        <select x-model="statusFilter" @change="loadJobs()"
          style="background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:7px 12px;color:var(--text);font-size:13px;outline:none;">
          <option value="">All statuses</option>
          <option>PENDING</option>
          <option>PROCESSING</option>
          <option>COMPLETED</option>
          <option>FAILED</option>
          <option>CANCELLED</option>
        </select>
        <button class="btn btn-ghost" @click="loadJobs()">↻ Refresh</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Retries</th>
              <th>Scheduled At</th>
              <th>Interval</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="jobs.length === 0">
              <tr><td colspan="9" class="empty">No jobs found</td></tr>
            </template>
            <template x-for="job in jobs" :key="job.id">
              <tr>
                <td style="font-family:monospace;font-size:11px;" x-text="job.id.slice(0,8) + '...'"></td>
                <td x-text="job.type"></td>
                <td>
                  <span :class="'priority-' + job.priority" x-text="job.priority === 1 ? '● High' : job.priority === 2 ? '● Med' : '● Low'"></span>
                </td>
                <td><span :class="'badge badge-' + job.status" x-text="job.status"></span></td>
                <td x-text="job.retryCount"></td>
                <td x-text="job.scheduledAt ? new Date(job.scheduledAt).toLocaleString() : '—'"></td>
                <td x-text="job.interval ?? '—'"></td>
                <td x-text="new Date(job.createdAt).toLocaleString()"></td>
                <td>
                  <button
                    class="btn btn-danger"
                    x-show="job.status === 'PENDING' || job.status === 'PROCESSING'"
                    @click="cancelJob(job.id)">
                    Cancel
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>

    <!-- Create Job Form -->
    <div x-show="tab === 'create'">
      <div class="form-card">
        <h2>Create New Job</h2>
        <div class="field">
          <label>Type</label>
          <select x-model="form.type">
            <option value="send_email">send_email</option>
          </select>
        </div>
        <div class="field">
          <label>Priority</label>
          <select x-model="form.priority">
            <option value="1">1 — High</option>
            <option value="2">2 — Medium</option>
            <option value="3">3 — Low</option>
          </select>
        </div>
        <div class="field">
          <label>Payload (JSON)</label>
          <textarea x-model="form.payload" placeholder='{"to":"user@example.com","subject":"Hello","body":"World"}'></textarea>
        </div>
        <div class="field">
          <label>Scheduled At (optional)</label>
          <input type="datetime-local" x-model="form.scheduledAt" />
        </div>
        <div class="field">
          <label>Recurring Interval (optional)</label>
          <select x-model="form.interval">
            <option value="">None</option>
            <option value="every_1_minute">Every 1 minute</option>
            <option value="every_5_minutes">Every 5 minutes</option>
            <option value="every_1_hour">Every 1 hour</option>
          </select>
        </div>
        <div class="field">
          <label>Depends On Job IDs (optional, comma-separated)</label>
          <input type="text" x-model="form.dependsOn" placeholder="uuid1, uuid2" />
        </div>

        <button class="btn btn-primary" @click="createJob()" :disabled="creating">
          <span x-text="creating ? 'Creating...' : 'Create Job'"></span>
        </button>
        <div class="success-msg" x-show="createSuccess" x-text="createSuccess"></div>
        <div class="error-msg"   x-show="createError"   x-text="createError"></div>
      </div>
    </div>

    <!-- DLQ Table -->
    <div x-show="tab === 'dlq'">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Type</th>
              <th>Priority</th>
              <th>Retries</th>
              <th>Error</th>
              <th>Failed At</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>
            <template x-if="dlqJobs.length === 0">
              <tr><td colspan="7" class="empty">No jobs in DLQ</td></tr>
            </template>
            <template x-for="job in dlqJobs" :key="job.id">
              <tr>
                <td style="font-family:monospace;font-size:11px;" x-text="job.id.slice(0,8) + '...'"></td>
                <td x-text="job.type"></td>
                <td>
                  <span :class="'priority-' + job.priority" x-text="job.priority === 1 ? '● High' : job.priority === 2 ? '● Med' : '● Low'"></span>
                </td>
                <td x-text="job.retryCount"></td>
                <td><div class="error-detail" :title="job.errorMessage" x-text="job.errorMessage ?? '—'"></div></td>
                <td x-text="new Date(job.updatedAt).toLocaleString()"></td>
                <td>
                  <button class="btn btn-primary" style="font-size:12px;padding:5px 12px;" @click="retryDlq(job.id)">
                    Retry
                  </button>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script>
    const API = 'http://localhost:3000';

    function app() {
      return {
        tab: 'jobs',
        jobs: [],
        dlqJobs: [],
        counts: {},
        statusFilter: '',
        creating: false,
        createSuccess: '',
        createError: '',
        form: {
          type: 'send_email',
          priority: '1',
          payload: '{"to":"user@example.com","subject":"Hello","body":"World"}',
          scheduledAt: '',
          interval: '',
          dependsOn: '',
        },

        init() {
          this.loadJobs();
          this.loadCounts();
          this.connectSse();
        },

        async loadJobs() {
   const url = this.statusFilter
    ? `${API}/jobs?status=${this.statusFilter}`
    : `${API}/jobs`;
  const res = await fetch(url);
  const data = await res.json();
  this.jobs = [...data]; // spread forces Alpine reactivity
 },

        async loadDlq() {
          const res = await fetch(`${API}/dlq`);
          this.dlqJobs = await res.json();
        },

        async loadCounts() {
          const res = await fetch(`${API}/jobs/dashboard`);
          this.counts = await res.json();
        },

        connectSse() {
          const es = new EventSource(`${API}/sse/jobs`);
          es.onmessage = (e) => {
    const job = JSON.parse(e.data);
    const idx = this.jobs.findIndex(j => j.id === job.id);
    if (idx !== -1) {
    this.jobs[idx] = { ...this.jobs[idx], ...job };
    this.jobs = [...this.jobs]; // force reactivity
   }
    this.loadCounts();
   };
          es.onerror = () => {
            setTimeout(() => this.connectSse(), 3000);
          };
        },

        async createJob() {
          this.creating = true;
          this.createSuccess = '';
          this.createError = '';

          try {
            let payload;
            try {
              payload = JSON.parse(this.form.payload);
            } catch {
              this.createError = 'Payload must be valid JSON';
              return;
            }

            const body = {
              type: this.form.type,
              priority: parseInt(this.form.priority),
              payload,
            };

            if (this.form.scheduledAt) {
              body.scheduledAt = new Date(this.form.scheduledAt).toISOString();
            }
            if (this.form.interval) {
              body.interval = this.form.interval;
            }
            if (this.form.dependsOn.trim()) {
              body.dependsOn = this.form.dependsOn.split(',').map(s => s.trim()).filter(Boolean);
            }

            const res = await fetch(`${API}/jobs`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(body),
            });

            if (!res.ok) {
              const err = await res.json();
              this.createError = err.message ?? 'Failed to create job';
              return;
            }

            const job = await res.json();
            this.createSuccess = `Job created: ${job.id}`;
            this.loadJobs();
            this.loadCounts();
          } finally {
            this.creating = false;
          }
        },

        async cancelJob(id) {
          await fetch(`${API}/jobs/${id}/cancel`, { method: 'PATCH' });
          this.loadJobs();
          this.loadCounts();
        },

        async retryDlq(id) {
          await fetch(`${API}/dlq/${id}/retry`, { method: 'POST' });
          this.loadDlq();
          this.loadCounts();
        },
      };
    }
  </script>
</body>
</html>
